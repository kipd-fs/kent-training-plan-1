name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Courierly.sln

      - name: Build
        run: dotnet build Courierly.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Courierly.sln --no-build --configuration Release --verbosity normal
