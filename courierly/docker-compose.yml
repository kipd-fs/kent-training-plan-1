services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: courierly-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Courierly#Train2026"
    ports:
      - "1433:1433"

  servicebus:
    profiles: ["bus"]
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: courierly-servicebus
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: "Courierly#Train2026"
      ACCEPT_EULA: "Y"
    depends_on:
      - sql

  azurite:
    profiles: ["bus"]
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: courierly-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
